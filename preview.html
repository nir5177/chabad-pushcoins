<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>בית חב״ד — תצוגה מקדימה</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0A1628;
    font-family: Arial, sans-serif;
    color: #F0F4FF;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    min-height: 100vh;
  }
  h1 { color: #F59E0B; font-size: 28px; margin-bottom: 4px; }
  h2 { color: #6B84B8; font-size: 14px; font-weight: normal; margin-bottom: 32px; }
  .section { margin-bottom: 40px; text-align: center; }
  .section-title { color: #6B84B8; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
  .coins-row { display: flex; gap: 20px; justify-content: center; align-items: flex-end; }
  .coin-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .coin-label { color: #6B84B8; font-size: 12px; }

  /* Phone mockup */
  .phone {
    background: #112244;
    border: 2px solid #1E40AF;
    border-radius: 40px;
    width: 320px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 0 60px rgba(30,64,175,0.3);
  }
  .total {
    font-size: 52px;
    font-weight: 900;
    color: #F59E0B;
    line-height: 1;
  }
  .total-label { color: #6B84B8; font-size: 14px; }
  .donate-btn {
    background: #1E40AF;
    color: white;
    border: none;
    border-radius: 32px;
    padding: 14px 48px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 4px 20px rgba(30,64,175,0.5);
  }
  .footer-note { color: #334070; font-size: 13px; }
</style>
</head>
<body>

<h1>בית חב״ד</h1>
<h2>קרית בורוכוב ותל גנים — תצוגה מקדימה</h2>

<!-- Phone mockup with all components -->
<div class="phone">

  <!-- ══ PUSHKE ══ -->
  <svg width="220" height="300" viewBox="0 0 220 300">
    <defs>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1a3a8a"/>
        <stop offset="0.3" stop-color="#1e4db7"/>
        <stop offset="0.7" stop-color="#1a3fa0"/>
        <stop offset="1" stop-color="#0f2060"/>
      </linearGradient>
      <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2a5ad4"/>
        <stop offset="1" stop-color="#1230a0"/>
      </linearGradient>
      <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4a7ae8" stop-opacity="0.6"/>
        <stop offset="1" stop-color="#4a7ae8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="bottomGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0f2060"/>
        <stop offset="1" stop-color="#091540"/>
      </linearGradient>
      <linearGradient id="slotGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000820"/>
        <stop offset="1" stop-color="#001040"/>
      </linearGradient>
    </defs>

    <!-- Shadow -->
    <ellipse cx="110" cy="278" rx="64" ry="8" fill="#000" opacity="0.35"/>

    <!-- Main body -->
    <rect x="22" y="54" width="176" height="216" rx="10" fill="url(#bodyGrad)"/>

    <!-- Sheen -->
    <rect x="22" y="54" width="62" height="216" rx="10" fill="url(#sheenGrad)"/>

    <!-- Top cap -->
    <rect x="19" y="44" width="182" height="20" rx="5" fill="url(#capGrad)"/>

    <!-- Coin slot -->
    <rect x="83" y="50" width="54" height="8" rx="4" fill="url(#slotGrad)"/>
    <rect x="84" y="51" width="52" height="2" rx="1" fill="#4a7ae8" opacity="0.4"/>

    <!-- Menorah -->
    <g transform="translate(110,118)">
      <!-- Base -->
      <rect x="-18" y="22" width="36" height="4" rx="2" fill="#F59E0B" opacity="0.9"/>
      <!-- Center stem -->
      <rect x="-2" y="-20" width="4" height="42" rx="2" fill="#F59E0B" opacity="0.9"/>
      <!-- Connecting bar -->
      <rect x="-24" y="3" width="48" height="4" rx="2" fill="#F59E0B" opacity="0.7"/>
      <!-- Left branches -->
      <rect x="-14" y="4" width="4" height="16" rx="2" fill="#F59E0B" opacity="0.85"/>
      <rect x="-22" y="10" width="4" height="10" rx="2" fill="#F59E0B" opacity="0.85"/>
      <!-- Right branches -->
      <rect x="10" y="4" width="4" height="16" rx="2" fill="#F59E0B" opacity="0.85"/>
      <rect x="18" y="10" width="4" height="10" rx="2" fill="#F59E0B" opacity="0.85"/>
      <!-- Flames -->
      <ellipse cx="2" cy="-22" rx="3" ry="5" fill="#F59E0B"/>
      <ellipse cx="-12" cy="2" rx="3" ry="4" fill="#F59E0B" opacity="0.9"/>
      <ellipse cx="14" cy="2" rx="3" ry="4" fill="#F59E0B" opacity="0.9"/>
      <ellipse cx="-20" cy="8" rx="2.5" ry="4" fill="#F59E0B" opacity="0.85"/>
      <ellipse cx="22" cy="8" rx="2.5" ry="4" fill="#F59E0B" opacity="0.85"/>
    </g>

    <!-- Text -->
    <text x="110" y="196" text-anchor="middle" fill="#F8FAFF" font-size="15" font-weight="bold" font-family="Arial">בית חב״ד</text>
    <text x="110" y="214" text-anchor="middle" fill="#bdd0ff" font-size="10" font-family="Arial">קרית בורוכוב ותל גנים</text>
    <text x="110" y="244" text-anchor="middle" fill="#7a9ae8" font-size="11" font-family="Arial">קופת צדקה</text>

    <!-- Bottom cap -->
    <rect x="28" y="264" width="164" height="14" rx="4" fill="url(#bottomGrad)"/>

    <!-- Lock -->
    <rect x="100" y="272" width="20" height="7" rx="3.5" fill="#0f2060" stroke="#2a50b0" stroke-width="1"/>
    <circle cx="110" cy="275.5" r="2" fill="#4a7ae8" opacity="0.7"/>
  </svg>

  <!-- ══ TOTAL ══ -->
  <div class="total">7 ₪</div>
  <div class="total-label">4 מטבעות הוכנסו</div>

  <!-- ══ COINS ROW ══ -->
  <div class="coins-row">

    <!-- ½ shekel — silver, small -->
    <div class="coin-wrap">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <defs>
          <linearGradient id="cg05" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0" stop-color="#e8e8e8"/>
            <stop offset="0.4" stop-color="#d0d0d0"/>
            <stop offset="0.7" stop-color="#b8b8b8"/>
            <stop offset="1" stop-color="#a0a0a0"/>
          </linearGradient>
          <linearGradient id="ce05" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c0c0c0"/>
            <stop offset="1" stop-color="#808080"/>
          </linearGradient>
        </defs>
        <circle cx="28" cy="30" r="27" fill="url(#ce05)"/>
        <circle cx="28" cy="28" r="26" fill="url(#cg05)"/>
        <circle cx="28" cy="28" r="21" fill="none" stroke="#a0a0a0" stroke-width="1.2" opacity="0.5"/>
        <text x="28" y="33" text-anchor="middle" fill="#404040" font-size="16" font-weight="bold" font-family="Arial">½</text>
        <ellipse cx="20" cy="18" rx="10" ry="5" fill="white" opacity="0.22" transform="rotate(-30,28,28)"/>
      </svg>
      <div class="coin-label">½ ₪</div>
    </div>

    <!-- 1 shekel — gold, medium -->
    <div class="coin-wrap">
      <svg width="68" height="68" viewBox="0 0 68 68">
        <defs>
          <linearGradient id="cg1" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0" stop-color="#ffe27a"/>
            <stop offset="0.35" stop-color="#f0b429"/>
            <stop offset="0.7" stop-color="#c8860a"/>
            <stop offset="1" stop-color="#a86000"/>
          </linearGradient>
          <linearGradient id="ce1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c89020"/>
            <stop offset="1" stop-color="#7a4800"/>
          </linearGradient>
        </defs>
        <circle cx="34" cy="36" r="33" fill="url(#ce1)"/>
        <circle cx="34" cy="34" r="32" fill="url(#cg1)"/>
        <circle cx="34" cy="34" r="27" fill="none" stroke="#a87000" stroke-width="1.2" opacity="0.5"/>
        <text x="34" y="40" text-anchor="middle" fill="#3a1800" font-size="20" font-weight="bold" font-family="Arial">1</text>
        <ellipse cx="24" cy="22" rx="12" ry="6" fill="white" opacity="0.22" transform="rotate(-30,34,34)"/>
      </svg>
      <div class="coin-label">₪1</div>
    </div>

    <!-- 5 shekels — gold, large -->
    <div class="coin-wrap">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <defs>
          <linearGradient id="cg5" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0" stop-color="#ffe27a"/>
            <stop offset="0.35" stop-color="#f0b429"/>
            <stop offset="0.7" stop-color="#c8860a"/>
            <stop offset="1" stop-color="#a86000"/>
          </linearGradient>
          <linearGradient id="ce5" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c89020"/>
            <stop offset="1" stop-color="#7a4800"/>
          </linearGradient>
        </defs>
        <circle cx="40" cy="42" r="39" fill="url(#ce5)"/>
        <circle cx="40" cy="40" r="38" fill="url(#cg5)"/>
        <circle cx="40" cy="40" r="33" fill="none" stroke="#a87000" stroke-width="1.2" opacity="0.5"/>
        <text x="40" y="47" text-anchor="middle" fill="#3a1800" font-size="24" font-weight="bold" font-family="Arial">5</text>
        <text x="40" y="59" text-anchor="middle" fill="#5a2800" font-size="10" font-family="Arial" opacity="0.7">שקל</text>
        <ellipse cx="28" cy="26" rx="14" ry="7" fill="white" opacity="0.22" transform="rotate(-30,40,40)"/>
      </svg>
      <div class="coin-label">₪5</div>
    </div>

    <!-- 10 shekels — gold, xl -->
    <div class="coin-wrap">
      <svg width="92" height="92" viewBox="0 0 92 92">
        <defs>
          <linearGradient id="cg10" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0" stop-color="#ffe27a"/>
            <stop offset="0.35" stop-color="#f0b429"/>
            <stop offset="0.7" stop-color="#c8860a"/>
            <stop offset="1" stop-color="#a86000"/>
          </linearGradient>
          <linearGradient id="ce10" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c89020"/>
            <stop offset="1" stop-color="#7a4800"/>
          </linearGradient>
        </defs>
        <circle cx="46" cy="48" r="45" fill="url(#ce10)"/>
        <circle cx="46" cy="46" r="44" fill="url(#cg10)"/>
        <circle cx="46" cy="46" r="39" fill="none" stroke="#a87000" stroke-width="1.2" opacity="0.5"/>
        <text x="46" y="54" text-anchor="middle" fill="#3a1800" font-size="27" font-weight="bold" font-family="Arial">10</text>
        <text x="46" y="67" text-anchor="middle" fill="#5a2800" font-size="11" font-family="Arial" opacity="0.7">שקל</text>
        <ellipse cx="32" cy="30" rx="16" ry="8" fill="white" opacity="0.22" transform="rotate(-30,46,46)"/>
      </svg>
      <div class="coin-label">₪10</div>
    </div>

  </div>

  <!-- ══ DONATE BUTTON ══ -->
  <button class="donate-btn">תרום 7 ₪ 💙</button>

  <div class="footer-note">כל מטבע שמכניסים — הוא מצוה!</div>

</div>

</body>
</html>
